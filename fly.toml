# Fly.io deployment configuration for BPOS
# See https://fly.io/docs/reference/configuration/

app = "sabby"
primary_region = "lhr"  # London - closest to Nigeria

[build]
  dockerfile = "Dockerfile"

[deploy]
  create_if_not_exists = true

[env]
  NODE_ENV = "staging"
  PORT = "3000"
  HOST = "0.0.0.0"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
